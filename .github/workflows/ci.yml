name: CI

on:
  push: {}
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The plugin ships no build step and no runtime dependencies: both halves
      # are hand-written plain JS. The only install is the schema library the
      # Host half imports — a peer dependency the DSH runtime otherwise supplies.
      # `npm ci` because the lock file is committed; never regenerate it with a
      # linked node_modules present, or npm records that link instead.
      - name: Install the one host peer the suites need
        run: npm ci --no-audit --no-fund

      - name: Host half — route injection and fork gate
        run: node tools/test-host.mjs

      - name: Client half — bundle shape, slot contract, render and save
        run: node tools/test-client.mjs

      # The market checks the published tarball, not the checkout: this grades what
      # `npm publish` would upload against the dsh.so submission gates, so a manifest
      # that stopped declaring its patch file or its DSH version fails here instead.
      - name: dsh.so submission gates — what the tarball ships
        run: node tools/check-submission.mjs
