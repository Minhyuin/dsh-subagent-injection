name: CI

on:
  push: {}
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The plugin ships no build step and no runtime dependencies: both halves
      # are hand-written plain JS. The only install is the schema library the
      # Host half imports — a peer dependency the DSH runtime otherwise supplies.
      - name: Install the one host peer the suites need
        run: npm install --no-audit --no-fund

      # TEMPORARY PROBE — remove once the install is known good.
      - name: Probe module resolution
        run: |
          echo "--- root node_modules ---"
          ls -la node_modules || true
          echo "--- @deepseek-ai ---"
          ls -la node_modules/@deepseek-ai || true
          echo "--- resolve from plugin/lib ---"
          node --input-type=module -e "
            try {
              const url = await import.meta.resolve('@deepseek-ai/schemastery');
              console.log('resolved:', url);
            } catch (error) {
              console.log('RESOLVE FAILED:', error.code, error.message);
            }
            try {
              const mod = await import('@deepseek-ai/schemastery');
              console.log('import ok, default type:', typeof mod.default);
            } catch (error) {
              console.log('IMPORT FAILED:', error.code, error.message);
            }
          " || true

      - name: Host half — route injection and fork gate
        run: node tools/test-host.mjs

      - name: Client half — bundle shape, slot contract, render and save
        run: node tools/test-client.mjs
